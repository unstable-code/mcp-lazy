# Publish stage jobs

# ─── GitHub Release (tag-only) ────────────────────────────────────────

publish:github-release:
  stage: publish
  image: alpine:latest
  rules:
    # The tag format is already filtered by workflow.rules.
    - if: $CI_COMMIT_TAG
  needs:
    - job: build:binary
      artifacts: true
  before_script:
    - apk add --no-cache git github-cli
  script:
    - (cd dist && sha256sum lazymcp-* > SHA256SUMS && ls -l)
    # If the release is created before the mirror delivers the tag, GitHub creates
    # a tag of that name on the default branch HEAD and the mirror's own tag push
    # then fails as a conflict. Wait until GitHub has this tag on this commit
    # (annotated tags resolve through ^{}, lightweight ones are the commit itself).
    - |
      URL="https://github.com/$GITHUB_REPO.git"
      for i in $(seq 1 30); do
        if git ls-remote --tags "$URL" "refs/tags/$CI_COMMIT_TAG" "refs/tags/$CI_COMMIT_TAG^{}" | grep -q "^$CI_COMMIT_SHA"; then
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "GitHub mirror did not get $CI_COMMIT_TAG ($CI_COMMIT_SHA) within 5 minutes" >&2
          exit 1
        fi
        echo "Waiting for the GitHub mirror to have $CI_COMMIT_TAG ($i/30)"; sleep 10
      done
    # --verify-tag refuses to create the tag itself, in case the wait above is
    # ever bypassed.
    - |
      GH_TOKEN="$GITHUB_PAT" gh release create "$CI_COMMIT_TAG" dist/* \
        --repo "$GITHUB_REPO" \
        --title "$CI_COMMIT_TAG" \
        --generate-notes \
        --verify-tag
