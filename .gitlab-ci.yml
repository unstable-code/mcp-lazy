# GitLab CI/CD pipeline for mcp-lazy.
# Runs on the instance's shared Docker runner (untagged). GitHub is a push mirror
# (configured in the GitLab UI, not here); releases are created there from this
# pipeline, so nothing runs on GitHub Actions.

stages:
  - check
  - build
  - publish

workflow:
  rules:
    # Version tags: full pipeline including the GitHub release
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR is already covered by the MR pipeline
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  GITHUB_REPO: unstable-code/mcp-lazy

# ─── Shared templates ─────────────────────────────────────────────────

.go:
  image: golang:1.26
  interruptible: true
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.go/cache
  # stdlib only, so the cache holds just GOCACHE; one key for every job.
  cache:
    key: go
    paths: [.go/]

# ─── Include action files ─────────────────────────────────────────────

include:
  - local: .gitlab/actions/check.yml
  - local: .gitlab/actions/build.yml
  - local: .gitlab/actions/publish.yml
